configuration:
  name: "GatewayConfiguration"

  # The DT never talks to the PLCs: it consumes what the platform data-gateway-service
  # (dt-platform/components/gateways/data-gateway-service) republishes on
  #   gateway/<setup>/<MachineModel>/<attribute>
  # The <setup> segment is wildcarded so the same file works for every setup (VIRTUAL_..., REN_...).
  mqttSourceBrokerUrl: tcp://localhost:1883
  mqttTargetBrokerUrl: tcp://localhost:1883

  mqttInfluxDbRecordings:
    - name: "Physical_Twin_VGR1"
      mqttSourceTopic: "gateway/+/VGRSystemModel_01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp

    - name: "Physical_Twin_VGR2"
      mqttSourceTopic: "gateway/+/VGRSystemModel_02/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp

  # Map gateway measurements onto the attributes of the SysML mission model.
  # mqttTargetTopic is "<SysML model>/<attribute path>" and is dispatched in-process to the DT engine
  # (nothing is republished on MQTT). Every gateway measurement also reaches the shopfloor UI
  # directly, without needing an entry here (see ShopfloorMachineIdResolver).
  dtEventGroups:
    - name: "TokenLocation/conveyorBelt"
      dataTransformation: clone
      mqttSourcePrefix: "gateway/+/CBSystemModel/"
      dtEvents:
        - mqttSourceTopic: "conveyorSensFeed"
          mqttTargetTopic: "TokenLocation/cb/conveyorSensFeed"

        - mqttSourceTopic: "conveyorSensSwap"
          mqttTargetTopic: "TokenLocation/cb/conveyorSensSwap"

    - name: "TokenLocation/sortingLine"
      dataTransformation: clone
      mqttSourcePrefix: "gateway/+/SLSystemModel/"
      dtEvents:
        - mqttSourceTopic: "sortingLineSensInputLightBarrier"
          mqttTargetTopic: "TokenLocation/sl/sensor_SL_in"

        - mqttSourceTopic: "sortingLineSensBlueLightBarrier"
          mqttTargetTopic: "TokenLocation/sl/sensor_SL_blue"

        - mqttSourceTopic: "sortingLineSensWhiteLightBarrier"
          mqttTargetTopic: "TokenLocation/sl/sensor_SL_white"

        - mqttSourceTopic: "sortingLineSensRedLightBarrier"
          mqttTargetTopic: "TokenLocation/sl/sensor_SL_red"

    - name: "TokenLocation/vgr1"
      dataTransformation: clone
      mqttSourcePrefix: "gateway/+/VGRSystemModel_01/"
      dtEvents:
        - mqttSourceTopic: "vacuumActCompressorOn"
          mqttTargetTopic: "TokenLocation/vgr1/vacuumActCompressorOn"

        - mqttSourceTopic: "vacuumActValve"
          mqttTargetTopic: "TokenLocation/vgr1/vacuumActValve"

    - name: "TokenLocation/vgr2"
      dataTransformation: clone
      mqttSourcePrefix: "gateway/+/VGRSystemModel_02/"
      dtEvents:
        - mqttSourceTopic: "vacuumActCompressorOn"
          mqttTargetTopic: "TokenLocation/vgr2/vacuumActCompressorOn"

        - mqttSourceTopic: "vacuumActValve"
          mqttTargetTopic: "TokenLocation/vgr2/vacuumActValve"

    # sensor_MPS_in / sensor_MPS_out are not published by the platform gateway configuration yet.
    - name: "TokenLocation/multiProcessingStation"
      dataTransformation: clone
      mqttSourcePrefix: "gateway/+/MPSystemModel/"
      dtEvents:
        - mqttSourceTopic: "sensor_MPS_in"
          mqttTargetTopic: "TokenLocation/mpo/sensor_MPS_in"

        - mqttSourceTopic: "sensor_MPS_out"
          mqttTargetTopic: "TokenLocation/mpo/sensor_MPS_out"

    # Test fixtures only: synthetic positioning values published by tools/mqtt-publishers.
    - name: "TokenLocation/testFixtures/positioning"
      dataTransformation: clone
      mqttSourcePrefix: "TEST/TokenLocation/positioning/"
      dtEvents:
        - mqttSourceTopic: "encoderTolerance"
          mqttTargetTopic: "TokenLocation/encoderTolerance"

        - mqttSourceTopic: "vgr1_3DPosition"
          mqttTargetTopic: "TokenLocation/vgr1/3DPosition"

        - mqttSourceTopic: "vgr1_expected3DPositionBlueOutput"
          mqttTargetTopic: "TokenLocation/vgr1/expected3DPositionBlueOutput"

        - mqttSourceTopic: "vgr1_expected3DPositionWhiteOutput"
          mqttTargetTopic: "TokenLocation/vgr1/expected3DPositionWhiteOutput"

        - mqttSourceTopic: "vgr1_expected3DPositionRedOutput"
          mqttTargetTopic: "TokenLocation/vgr1/expected3DPositionRedOutput"

        - mqttSourceTopic: "vgr2_3DPosition"
          mqttTargetTopic: "TokenLocation/vgr2/3DPosition"

        - mqttSourceTopic: "vgr2_expected3DPositionCBSwap"
          mqttTargetTopic: "TokenLocation/vgr2/expected3DPositionCBSwap"
