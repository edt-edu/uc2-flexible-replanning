spring.application.name=uc2-dt
server.port=8080
sysml.models.path=classpath*:models/**/*.sysml
anomaly-detection.primary-state-machine=TokenLocation
# How often (ms) to proactively re-check StateDurationLimit constraints via checkTimeTransitions(),
# so a stalled state is noticed even if no new MQTT message arrives after its deadline passes.
anomaly-detection.timeout-poll-interval-ms=2000

influx.url=${INFLUX_URL:http://localhost:8086}
influx.token=${INFLUX_TOKEN:my-super-token}
influx.org=${INFLUX_ORG:uc2-org}
influx.bucket=${INFLUX_BUCKET:digital_twin}

mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:uc2-dt-digital-shadow}
mqtt.topics=${MQTT_TOPICS:gateway/#}

# Platform gateway topics (gateway/<setup>/<MachineModel>/<attribute>) pushed to the shopfloor UI.
telemetry.gateway-topic-filter=${TELEMETRY_GATEWAY_TOPIC_FILTER:gateway/#}

spring.config.import=optional:classpath:configuration.yml

logging.level.mbdo.dt.services.impl.AnomalyDetectionImpl=DEBUG
# Replanning: the FactorySCADA REST API the digital twin asks to swap missions and send commands to the machines
scada.base-url=${SCADA_BASE_URL:http://localhost:9000}
# The replanning of an anomaly is executed at once. One that can't be yet (e.g. a gripper still over the belt) is
# planned again every retry-delay, for at most retry-max, while its incident is open
replanning.retry-delay-ms=1000
replanning.retry-max-ms=60000
# How long the stop command of a failed machine may take (waiting for the machine to be idle, then for its feedback)
replanning.command-timeout-ms=60000
