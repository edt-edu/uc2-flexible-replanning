services:
  influxdb:
    image: influxdb:2.7
    container_name: uc2-influxdb
    ports:
      - "8086:8086"
    volumes:
      - uc2-influxdb-data:/var/lib/influxdb2
      - uc2-influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: uc2-mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - uc2-mosquitto-data:/mosquitto/data
      - uc2-mosquitto-log:/mosquitto/log

  digital-twin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uc2-digital-twin-app
    ports:
      - "8080:8080"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUXDB_TOKEN}
      INFLUX_ORG: ${INFLUXDB_ORG}
      INFLUX_BUCKET: ${INFLUXDB_BUCKET}
      MQTT_BROKER_URL: tcp://mqtt-broker:1883
      MQTT_CLIENT_ID: uc2-dt-digital-shadow
      MQTT_TOPICS: "#"
    depends_on:
      influxdb:
        condition: service_healthy
      mqtt-broker:
        condition: service_started

volumes:
  uc2-influxdb-data:
  uc2-influxdb-config:
  uc2-mosquitto-data:
  uc2-mosquitto-log: